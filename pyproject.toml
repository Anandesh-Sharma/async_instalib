[project]
name = "async_instalib"
version = "0.1.0"
description = "An async, session-oriented Python client for Instagram's mobile API."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx[http2,zstd]>=0.28,<1", "cryptography>=44"]

license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Anandesh Sharma"}]
keywords = ["instagram", "asyncio", "python", "httpx", "api-client"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: AsyncIO",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: POSIX",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/Anandesh-Sharma/async_instalib"
Repository = "https://github.com/Anandesh-Sharma/async_instalib"
Issues = "https://github.com/Anandesh-Sharma/async_instalib/issues"
Documentation = "https://github.com/Anandesh-Sharma/async_instalib#readme"

[project.scripts]
async-instalib = "async_instalib.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.25", "ruff>=0.15", "mypy>=1.15"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/async_instalib"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.11"
strict = true
